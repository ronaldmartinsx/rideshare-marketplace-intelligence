# "TLC de mentira" (Fase 2, etapa 8): um servidor que se comporta como o CloudFront/S3 da TLC.
# Serve os arquivos de data/tlc_de_mentira/trip-data/ (gerados por scripts/fase-2/gerar_amostra.sql).
server {
    listen 80;

    location /trip-data/ {
        root /usr/share/nginx/html;

        # ETag calculado da data de modificação + tamanho do arquivo. Por isso um `touch`
        # muda o ETag sem mudar o conteúdo: o cenário "ETag novo, mesmo SHA-256" da etapa 5.
        etag on;

        # Como o S3 da TLC: arquivo inexistente responde 403, não 404 (Aula 3).
        try_files $uri =403;
    }
}
