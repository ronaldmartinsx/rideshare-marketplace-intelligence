version: 2

# Gold: tabelas pequenas, com grão claro, prontas para o Power BI, o ML e o agente de IA.
# A corrida individual não sai da Silver. As definições das métricas ficam no `meta` de cada
# modelo: são a fonte única para as medidas DAX (Fase 4) e o contexto do agente (Fase 6).

models:
  - name: dim_zona
    description: >
      Uma linha por zona de táxi da TLC. Dimensão conformada: serve às fatos de demanda, de espera
      e de origem-destino (nesta, em dois papéis: origem e destino).
    meta:
      grao: "zona de táxi da TLC"
    columns:
      - name: zona_id
        description: "Código da zona (LocationID da TLC)."
        data_tests: [unique, not_null]
      - name: is_cbd
        description: "Dentro da Congestion Relief Zone (38 zonas, lista oficial da MTA; ADR 0007)."
      - name: is_aeroporto
        description: "JFK, LaGuardia ou Newark."
      - name: is_zona_conhecida
        description: >
          Falso só para a 264 ("Unknown"): a corrida conta no total da cidade, mas não tem lugar no
          mapa. Use para filtrar análises por zona.
      - name: is_fora_de_nyc
        description: "Newark (Nova Jersey) e a 265 (Outside of NYC): destinos reais fora dos 5 boroughs."

  - name: dim_operadora
    description: "Uma linha por licença HVFHS (Uber, Lyft e as inativas Juno e Via). Fonte: dicionário da TLC."
    meta:
      grao: "licença HVFHS"
    columns:
      - name: operadora_id
        description: "Código da licença (HV0002 a HV0005), o mesmo de hvfhs_license_num."
        data_tests: [unique, not_null]

  - name: dim_faixa_espera
    description: >
      Uma linha por faixa de espera do histograma (18): limites em minutos e um rótulo para o eixo dos
      gráficos ("0–1 min" ... "30+ min"). Ordene o rótulo pelo faixa_id no Power BI.
    meta:
      grao: "faixa de espera"
    columns:
      - name: faixa_id
        description: "0 a 14: faixas de 1 minuto; 15: 15–20 min; 16: 20–30 min; 17: 30 min ou mais."
        data_tests: [unique, not_null]
      - name: faixa_fim_min
        description: "Nulo só na faixa 17 (30+): sem fim, não dá para interpolar dentro dela."

  - name: dim_tempo_hora
    description: >
      Uma linha por hora LOCAL de Nova York, de 2024-01-01 a 2026-12-31: calendário, feriados federais,
      tipo de dia (útil, fim de semana, feriado), clima da hora e a marcação das horas de troca do
      horário de verão (ADR 0009). A hora "inexistente" de março existe aqui de propósito: a TLC
      registra algumas corridas nela (85 em 09/03/2025), e a fato precisa encontrá-la.
    meta:
      grao: "hora local de Nova York"
    columns:
      - name: hora
        data_tests: [unique, not_null]
      - name: tipo_dia
        description: "util | fim_de_semana | feriado (só feriados federais). Grão do histograma de espera."
        data_tests:
          - accepted_values:
              arguments:
                values: ['util', 'fim_de_semana', 'feriado']
      - name: hora_troca_horario_verao
        description: >
          'inexistente' (2º domingo de março, 2h: o relógio pula), 'repetida' (1º domingo de novembro,
          1h: soma o movimento de duas horas reais) ou nulo. Marque essas horas em análises por hora e
          no modelo de previsão (Fase 5).
      - name: periodo_id
        description: "Chave do período do histograma (mês|hora do dia|tipo de dia, ex.: 2025-03|18|util)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_periodo_espera')
                field: periodo_id

  - name: dim_mes
    description: >
      Uma linha por mês (2024 a 2026). Topo da hierarquia de tempo no Power BI: filtra a
      dim_periodo_espera (e por ela a dim_tempo_hora) e a fct_od_mensal.
    meta:
      grao: "mês"
    columns:
      - name: ano_mes
        description: "AAAA-MM, o mesmo formato do source_month."
        data_tests: [unique, not_null]

  - name: dim_periodo_espera
    description: >
      Dimensão encolhida (shrunken) da dim_tempo_hora, no grão do histograma de espera: mês × hora do dia
      × tipo de dia. Filtra a fct_espera_histograma direto e a fct_demanda_zona_hora pela dim_tempo_hora.
      Use as segmentações de período DESTA tabela nas páginas com o P90; data e hora exatas não existem
      no histograma (ADR 0006).
    meta:
      grao: "mês × hora do dia × tipo de dia"
    columns:
      - name: periodo_id
        data_tests: [unique, not_null]
      - name: ano_mes
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_mes')
                field: ano_mes

  - name: fct_demanda_zona_hora
    description: >
      Demanda e economia por hora de embarque × zona de origem × operadora. Só corridas válidas (nível
      corrida). As somas econômicas usam só as corridas com tarifa válida (nível métrica), todas sobre o
      mesmo conjunto de corridas. Incremental por source_month. Peça ✍️ do Ronald (Fase 1), estendida na Fase 3.
    meta:
      grao: "hora de embarque (local NY) × zona de origem × operadora"
      # Fonte única das métricas (spec 2.5): as medidas DAX (Fase 4) e o agente (Fase 6) usam estas fórmulas.
      metricas:
        corridas_validas:
          formula: "sum(qtd_corridas)"
        take_rate:
          formula: "(sum(tarifa_base_total) - sum(repasse_motorista_total)) / sum(tarifa_base_total)"
          cuidado: "Razão das SOMAS, nunca média de take rates. Só corridas com tarifa > 0."
        receita_por_milha:
          formula: "sum(tarifa_base_total) / sum(milhas_tarifa_valida_total)"
          cuidado: "Numerador e denominador das mesmas corridas (tarifa válida)."
        repasse_por_hora_de_corrida:
          formula: "sum(repasse_motorista_total) / (sum(segundos_tarifa_valida_total) / 3600)"
          cuidado: "NÃO é o ganho por hora do motorista: o dado não tem tempo ocioso nem id de motorista."
        share_operadora:
          formula: "sum(qtd_corridas) da operadora / sum(qtd_corridas) do mesmo recorte"
        corridas_destino_cbd:
          formula: "sum(qtd_corridas_destino_cbd)"
          cuidado: "Destino pela lista de zonas da MTA, não pela taxa (ADR 0007). Antes x depois: corte em 2025-01-05."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['hora_embarque', 'zona_origem_id', 'licenca_operadora']
          config:
            where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
    columns:
      - name: hora_embarque
        data_tests:
          - not_null:
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
          - relationships:
              arguments:
                to: ref('dim_tempo_hora')
                field: hora
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: zona_origem_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zona')
                field: zona_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: licenca_operadora
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_operadora')
                field: operadora_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"

  - name: fct_espera_histograma
    description: >
      Histograma do tempo de espera (pedido -> embarque): contagem de corridas por faixa de espera, por
      mês × hora do dia × tipo de dia × zona de origem × operadora (ADR 0006). Só corridas válidas e com
      espera válida (entre 0 e 2 h). As contagens somam em qualquer recorte; o percentil sai no consumo.
    meta:
      grao: "mês × hora do dia × tipo de dia × zona de origem × operadora × faixa de espera"
      metricas:
        espera_percentil:
          passos: >
            1) filtrar o recorte (zona, hora do dia, tipo de dia, mês...); 2) somar qtd_corridas por faixa
            e o total; 3) acumular as faixas em ordem de faixa_id até passar de p × total (p = 0,5 ou 0,9);
            4) interpolar na faixa encontrada: faixa_inicio_min + (p × total - acumulado antes) /
            qtd_corridas da faixa × (faixa_fim_min - faixa_inicio_min); 5) se cair na faixa 17 (30+),
            a resposta é ">= 30 min".
          cuidado: "Percentil NÃO soma nem tira média entre recortes: sempre recalcular a partir das faixas."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['hora_do_dia', 'tipo_dia', 'zona_origem_id', 'licenca_operadora', 'faixa_id']
          config:
            where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
    columns:
      - name: tipo_dia
        data_tests:
          - not_null:
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: periodo_id
        description: "Chave da dim_periodo_espera (mês|hora do dia|tipo de dia). Liga o histograma ao tempo no Power BI."
        data_tests:
          - not_null:
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
          - relationships:
              arguments:
                to: ref('dim_periodo_espera')
                field: periodo_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: faixa_id
        description: "Faixa de espera; limites e rótulo na dim_faixa_espera."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_faixa_espera')
                field: faixa_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: zona_origem_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zona')
                field: zona_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: licenca_operadora
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_operadora')
                field: operadora_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"

  - name: fct_od_diario
    description: >
      Fluxos de origem-destino por dia × zona de origem × zona de destino × operadora. Só corridas
      válidas. A dim_zona entra em dois papéis (origem e destino): no Power BI, um relacionamento
      inativo ligado com USERELATIONSHIP. Base do mapa de fluxos e da análise do CBD (destino).
    meta:
      grao: "dia de embarque × zona de origem × zona de destino × operadora"
      metricas:
        corridas_validas:
          formula: "sum(qtd_corridas)"
        receita_por_milha:
          formula: "sum(tarifa_base_total) / sum(milhas_tarifa_valida_total)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['data_embarque', 'zona_origem_id', 'zona_destino_id', 'licenca_operadora']
          config:
            where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
    columns:
      - name: zona_origem_id
        description: "Papel 'origem' da dim_zona."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zona')
                field: zona_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: zona_destino_id
        description: "Papel 'destino' da dim_zona (relacionamento inativo no Power BI)."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zona')
                field: zona_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: licenca_operadora
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_operadora')
                field: operadora_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"

  - name: fct_od_mensal
    description: >
      Fluxos de origem-destino por mês × zona de origem × zona de destino × operadora, somados da
      fct_od_diario (Fase 4, D2). É a tabela de origem-destino do Power BI: a diária fica no Athena.
      O corte diário do antes × depois da taxa do CBD (05/01/2025) vem da fct_demanda_zona_hora.
    meta:
      grao: "mês × zona de origem × zona de destino × operadora"
      metricas:
        corridas_validas:
          formula: "sum(qtd_corridas)"
        corridas_entrando_no_cbd:
          formula: "sum(qtd_corridas) com dim_zona (papel destino) is_cbd e dim_zona (papel origem) não is_cbd"
          cuidado: "Destino pela lista de zonas da MTA (ADR 0007). jan/2025 mistura 4 dias antes da taxa."
        receita_por_milha:
          formula: "sum(tarifa_base_total) / sum(milhas_tarifa_valida_total)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['zona_origem_id', 'zona_destino_id', 'licenca_operadora']
          config:
            where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
    columns:
      - name: zona_origem_id
        description: "Papel 'origem' da dim_zona."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zona')
                field: zona_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: zona_destino_id
        description: "Papel 'destino' da dim_zona (relacionamento inativo no Power BI)."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zona')
                field: zona_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: licenca_operadora
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_operadora')
                field: operadora_id
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
      - name: source_month
        description: "Mês (AAAA-MM). Liga a fato à dim_mes no Power BI."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_mes')
                field: ano_mes
              config:
                where: "source_month = '{{ var(\"source_month\", \"2025-01\") }}'"
