name: rideshare
version: "0.1.0"
config-version: 2

# Qual bloco do profiles.yml usar
profile: rideshare

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

models:
  rideshare:
    # Padrão do projeto: tabelas Iceberg (o padrão do dbt-athena seria Hive)
    +table_type: iceberg
    +format: parquet
    # Uma pasta única por versão da tabela, em TODAS as camadas (não só na Gold). Reconstruir uma
    # tabela Iceberg (materialização table ou --full-refresh de um incremental) cria a nova ao lado,
    # troca o nome e apaga a antiga, e apagar uma tabela Iceberg apaga os arquivos da pasta dela.
    # Com a mesma pasta, a nova seria apagada junto (aconteceu na Fase 3, etapa 4, em dev).
    +s3_data_naming: schema_table_unique

    # A pasta decide a camada (spec, seção 5). O nome final do banco
    # (silver ou dev_silver) é montado pela macro generate_schema_name.
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
      # Materialização table em Iceberg: o dbt-athena cria a tabela nova ao lado e troca
      # o nome (rename), sem janela sem dados. Exige um caminho único por versão.
      # Resultado: lake/<banco>/<tabela>/<id único>/ (ainda dentro do prefixo do banco).
      +s3_data_naming: schema_table_unique

# Seeds: tabelas pequenas e quase estáticas, versionadas como CSV (Fase 3, decisão F10).
# Ficam no banco da Silver (silver ou dev_silver). Tipos declarados para o dbt não adivinhar.
seeds:
  rideshare:
    +schema: silver
    # Iceberg, e não o padrão Hive: com o local dos resultados imposto pelo workgroup, um seed Hive vai
    # parar no bucket de resultados do Athena, que apaga tudo em 7 dias. Iceberg sempre recebe pasta no lake.
    +table_type: iceberg
    +s3_data_naming: schema_table_unique
    seed_zonas_tlc:
      +column_types:
        LocationID: int
        Borough: string
        Zone: string
        service_zone: string
    seed_zonas_cbd:
      +column_types:
        location_id: int
        zona: string
    seed_operadoras:
      +column_types:
        licenca: string
        operadora: string
        ativa: boolean
    seed_feriados:
      +column_types:
        data: date
        feriado: string
        esfera: string
        data_observada: date
